# Spring + Oracle UCP (aligns with score service style). Replace placeholders via env or ConfigMap.
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${REPLAY_DB_URL:jdbc:oracle:thin:@SERVICE_NAME_high?TNS_ADMIN=PATH_TO_WALLET}
spring.datasource.username=${REPLAY_DB_USER:ADMIN}
spring.datasource.password=${REPLAY_DB_PASSWORD:PASSWORD}

# UCP
oracle.jdbc.fanEnabled=true
spring.datasource.type=oracle.ucp.jdbc.PoolDataSource
spring.datasource.oracleucp.sql-for-validate-connection=select * from dual
spring.datasource.oracleucp.connection-pool-name=replayPool
spring.datasource.oracleucp.initial-pool-size=1
spring.datasource.oracleucp.min-pool-size=1
spring.datasource.oracleucp.max-pool-size=5

server.port=${REPLAY_HTTP_PORT:8082}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Disable JDBC autoconfiguration by default to allow running without DB credentials/wallet
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
