<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCI Multiplayer</title>
  </head>
  <body>
    <video id="video-background" autoplay muted loop>
      <!-- <source src="assets/menu/videoBack.m4v" type="video/mp4" /> -->
    </video>
    <div id="overlay">
      <div id="logo">
        <!-- <img src="web/static/assets/menu/logoPlusOCI.png"> -->
      </div>
      <div id="input">
        <p>Your Name:</p>
        <input name="name" autofocus />
        <button id="startButton">Play</button>
      </div>
      <div id="lobby" style="display: none;">
        <h1>Top Scores</h1>
        <div id="games-container">
          <table id="playerTable">
            <thead>
              <tr>
                <th>Name</th>
                <th>Score</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <h2>Waiting Players</h2>
        <ul id="waiting-list" style="margin: 6px 0 12px 18px;"></ul>

        <h2>Lobby Chat</h2>
        <div
          id="chat-log"
          style="height: 160px; overflow-y: auto; padding: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.35); margin-bottom: 6px;"
        ></div>
        <div style="display: flex; gap: 6px; align-items: center; margin-bottom: 12px;">
          <input id="chat-text" maxlength="300" placeholder="Message..." style="flex: 1;" />
          <button id="chat-send">Send</button>
        </div>

        <button id="create-game-button">Create New Game</button>
      </div>
      <div id="instructions">
        <p style="font-size: 24px; font-weight: bold; text-align: center">
          Instructions:
        </p>
        <ul>
          <li>
            Collect <span style="color: brown">trash</span>, avoid
            <span style="color: green">animals</span>
          </li>
          <li><br /></li>
          <p>Controls:</p>
          <li><b>Arrow Up </b>- Accelerate</li>
          <li><b>Arrow Down </b> - Brake</li>
          <li><b>Left</b> or <b>Right Arrow</b> to Steer</li>
        </ul>
      </div>
    </div>
    <canvas class="Game"></canvas>
    <button id="restart-btn" style="display: none">Restart</button>

    <div id="admin-controls" style="position: fixed; top: 10px; right: 10px; z-index: 1000;">
      <button id="admin-start">Start Game</button>
      <button id="admin-end">End Game</button>
    </div>

    
  </body>
</html>
