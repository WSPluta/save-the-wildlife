server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header Cache-Control "no-store, max-age=0" always;

  # Compatibility for stale admin HTML that referenced assets relatively
  # from /admin/*. Serve the real root asset instead of the SPA shell.
  location ~ ^/admin/(.+\.(?:css|js|map|png|jpg|jpeg|gif|webp|svg|ico|gltf|glb|bin|m4v|mp4|wasm|json))$ {
    try_files /$1 =404;
  }

  location = /healthz {
    default_type application/json;
    return 200 '{"ok":true,"service":"web"}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
