version: 0.1
component: build
timeoutInSeconds: 1200
failImmediatelyOnError: true
shell: bash

env:
  exportedVariables:
    - WS_SERVER_VERSION
    - WEB_VERSION
    - SCORE_VERSION
    - REPLAY_VERSION
    - PAF_VERSION

steps:
  - type: Command
    name: "Install libraries (jq, Node.js 18, podman, zx)"
    command: |
      set -Eeuo pipefail
      trap 'echo "[FATAL] Install libraries failed at line $LINENO" >&2' ERR

      echo "=== SYSTEM INFO ==="
      cat /etc/os-release || true
      uname -a || true

      if command -v dnf >/dev/null 2>&1; then
        echo "Using dnf"
        dnf -y update || true
        dnf -y install jq podman || true
        # Try AppStream modules for Node 18 (OL8+)
        dnf -y module enable nodejs:18 || true
        dnf -y module install nodejs || dnf -y install nodejs || true
      else
        echo "Using yum"
        yum -y update || true
        yum -y install jq podman || true
        # Install Node.js 18 from NodeSource on OL7/RHEL-like
        curl -fsSL https://rpm.nodesource.com/setup_18.x | bash - || true
        yum -y install nodejs || true
      fi

      npm -g config set fund false audit false || true
      npm ci --include=dev
      npm i -g zx@7 || true

      echo "=== TOOL VERSIONS ==="
      node -v || true
      npm -v || true
      npx -v || true
      which docker || true && docker -v || true
      which podman || true && podman -v || true
      which zx || true && zx --version || true

  - type: Command
    name: "Set up server versions"
    command: |
      set -Eeuo pipefail
      trap 'echo "[FATAL] Set up server versions failed at line $LINENO" >&2' ERR

      export WS_SERVER_VERSION=$(jq -r '.version' server/package.json)
      echo "WS_SERVER_VERSION: $WS_SERVER_VERSION"

      export WEB_VERSION=$(jq -r '.version' web/package.json)
      echo "WEB_VERSION: $WEB_VERSION"

      export SCORE_VERSION=$(grep -E "^version\s*=\s*'[^']+'" score/build.gradle | sed -E "s/.*'([^']+)'.*/\1/")
      echo "SCORE_VERSION: $SCORE_VERSION"

      export REPLAY_VERSION=$(grep -E "^version\s*=\s*'[^']+'" replay/build.gradle | sed -E "s/.*'([^']+)'.*/\1/")
      echo "REPLAY_VERSION: $REPLAY_VERSION"

      export PAF_VERSION="${PAF_VERSION:-latest}"
      export PAF_PACKAGE_VERSION=$(jq -r '.version' private-agent-factory/package.json)
      echo "PAF_VERSION: $PAF_VERSION"
      echo "PAF_PACKAGE_VERSION: $PAF_PACKAGE_VERSION"

  - type: Command
    name: "Build ws-server"
    command: |
      set -Eeuo pipefail
      trap 'echo "[FATAL] Build ws-server failed at line $LINENO" >&2' ERR
      npx zx scripts/build.mjs ws-server

  - type: Command
    name: "Build web"
    command: |
      set -Eeuo pipefail
      trap 'echo "[FATAL] Build web failed at line $LINENO" >&2' ERR
      npx zx scripts/build.mjs web

  - type: Command
    name: "Build score"
    command: |
      set -Eeuo pipefail
      trap 'echo "[FATAL] Build score failed at line $LINENO" >&2' ERR
      npx zx scripts/build.mjs score

  - type: Command
    name: "Build replay"
    command: |
      set -Eeuo pipefail
      trap 'echo "[FATAL] Build replay failed at line $LINENO" >&2' ERR
      npx zx scripts/build.mjs replay

  - type: Command
    name: "Build private-agent-factory"
    command: |
      set -Eeuo pipefail
      trap 'echo "[FATAL] Build private-agent-factory failed at line $LINENO" >&2' ERR
      npx zx scripts/build.mjs private-agent-factory

outputArtifacts:
  - name: server
    type: DOCKER_IMAGE
    location: server:${WS_SERVER_VERSION}
  - name: web
    type: DOCKER_IMAGE
    location: web:${WEB_VERSION}
  - name: score
    type: DOCKER_IMAGE
    location: score:${SCORE_VERSION}
  - name: replay
    type: DOCKER_IMAGE
    location: replay:${REPLAY_VERSION}
  - name: private-agent-factory
    type: DOCKER_IMAGE
    location: private-agent-factory:${PAF_VERSION}
