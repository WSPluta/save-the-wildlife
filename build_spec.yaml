version: 0.1             
component: build
timeoutInSeconds: 1200
failImmediatelyOnError: true
shell: bash

env:
  exportedVariables:
    - WS_SERVER_VERSION
    - WEB_VERSION
    - SCORE_VERSION

steps:
  - type: Command
    name: "Install libraries"
    command: |
      set -Eeuo pipefail
      trap 'echo "[FATAL] Install libraries failed at line $LINENO" >&2' ERR

      echo "=== SYSTEM INFO ==="
      cat /etc/os-release || true
      echo "=== DNF REPOS ==="
      dnf repolist || true
      echo "=== DISK SPACE ==="
      df -h
      echo "=== MEMORY ==="
      free -h || true

      echo "=== UPDATING PACKAGES ==="
      dnf -y update

      echo "=== INSTALLING TOOLS (jq, Node.js 18, podman, zx) ==="
      dnf -y install jq podman
      dnf -y module enable nodejs:18
      dnf -y module install nodejs
      npm -g config set fund false audit false || true
      npm i -g zx@7
      echo "=== zx version ==="
      zx --version || true
      echo "=== npm global bin ==="
      npm bin -g || true

      echo "=== TOOL VERSIONS ==="
      node -v || true
      npm -v || true
      npx -v || true
      which docker || true
      docker -v || true
      which podman || true
      podman -v || true

      echo "=== PODMAN INFO (if available) ==="
      podman info || true

  - type: Command
    name: "Set up server versions"
    command: |
      set -Eeuo pipefail
      trap 'echo "[FATAL] Set up server versions failed at line $LINENO" >&2' ERR

      echo "=== READ VERSIONS ==="
      if [ -f server/package.json ]; then
        WS_SERVER_VERSION=$(jq -r '.version // empty' server/package.json)
      else
        WS_SERVER_VERSION=""
        echo "[WARN] server/package.json missing"
      fi
      echo "WS_SERVER_VERSION: ${WS_SERVER_VERSION:-<unset>}"
      export WS_SERVER_VERSION

      if [ -f web/package.json ]; then
        WEB_VERSION=$(jq -r '.version // empty' web/package.json)
      else
        WEB_VERSION=""
        echo "[WARN] web/package.json missing"
      fi
      echo "WEB_VERSION: ${WEB_VERSION:-<unset>}"
      export WEB_VERSION

      if [ -f score/build.gradle ]; then
        echo "score/build.gradle version lines:"
        grep -n "version" score/build.gradle || true
        SCORE_VERSION=$(grep -E "^version\s*=\s*'[^']+'" -n score/build.gradle | head -n1 | sed -E "s/.*'([^']+)'.*/\1/")
      else
        SCORE_VERSION=""
        echo "[WARN] score/build.gradle missing"
      fi
      echo "SCORE_VERSION: ${SCORE_VERSION:-<unset>}"
      export SCORE_VERSION

  - type: Command
    name: "Build ws-server"
    command: |
      set -Eeuo pipefail
      trap 'echo "[FATAL] Build ws-server failed at line $LINENO" >&2' ERR

      # Pass through OCIR credentials if present (optional; build works without push)
      export OCIR_USER=${ocir_user:-}
      export OCIR_USERNAME=${ocir_user:-}
      export OCIR_TOKEN=${ocir_token:-}
      export NAMESPACE=${namespace:-}
      export TENANCY_NAMESPACE=${tenancy_namespace:-${namespace:-}}
      export REGION_KEY=${region_key:-}
      export PUSH_TO_OCIR=1
      export OCI_REGION=${region:-${oci_region:-}}

      echo "=== BUILD ws-server CONTEXT ==="
      echo "NAMESPACE=${NAMESPACE:-unset} REGION_KEY=${REGION_KEY:-unset} OCI_REGION=${OCI_REGION:-unset} OCIR_USER=$(test -n "${OCIR_USER:-}" && echo set || echo unset) OCIR_TOKEN=$(test -n "${OCIR_TOKEN:-}" && echo present || echo unset)"
      node -v || true; npm -v || true; npx -v || true
      which docker || true; docker -v || true
      which podman || true; podman -v || true

      echo "Resolving zx binary..."
      ZX_BIN="$(command -v zx || true)"
      if [ -z "$ZX_BIN" ]; then ZX_BIN="$(npm bin -g)/zx"; fi
      if [ ! -x "$ZX_BIN" ]; then
        npm i -g zx@7
        ZX_BIN="$(command -v zx || true)"
        if [ -z "$ZX_BIN" ]; then ZX_BIN="$(npm bin -g)/zx"; fi
      fi
      "$ZX_BIN" --version || true

      echo "Invoking build script..."
      DEBUG_BUILD=1 "$ZX_BIN" scripts/build.mjs ws-server

  - type: Command
    name: "Build web"
    command: |
      set -Eeuo pipefail
      trap 'echo "[FATAL] Build web failed at line $LINENO" >&2' ERR

      export OCIR_USER=${ocir_user:-}
      export OCIR_USERNAME=${ocir_user:-}
      export OCIR_TOKEN=${ocir_token:-}
      export NAMESPACE=${namespace:-}
      export TENANCY_NAMESPACE=${tenancy_namespace:-${namespace:-}}
      export REGION_KEY=${region_key:-}
      export PUSH_TO_OCIR=1
      export OCI_REGION=${region:-${oci_region:-}}

      echo "=== BUILD web CONTEXT ==="
      echo "NAMESPACE=${NAMESPACE:-unset} REGION_KEY=${REGION_KEY:-unset} OCI_REGION=${OCI_REGION:-unset} OCIR_USER=$(test -n "${OCIR_USER:-}" && echo set || echo unset) OCIR_TOKEN=$(test -n "${OCIR_TOKEN:-}" && echo present || echo unset)"
      node -v || true; npm -v || true; npx -v || true
      which docker || true; docker -v || true
      which podman || true; podman -v || true

      echo "Resolving zx binary..."
      ZX_BIN="$(command -v zx || true)"
      if [ -z "$ZX_BIN" ]; then ZX_BIN="$(npm bin -g)/zx"; fi
      if [ ! -x "$ZX_BIN" ]; then
        npm i -g zx@7
        ZX_BIN="$(command -v zx || true)"
        if [ -z "$ZX_BIN" ]; then ZX_BIN="$(npm bin -g)/zx"; fi
      fi
      "$ZX_BIN" --version || true

      echo "Invoking build script..."
      DEBUG_BUILD=1 "$ZX_BIN" scripts/build.mjs web

  - type: Command
    name: "Build score"
    command: |
      set -Eeuo pipefail
      trap 'echo "[FATAL] Build score failed at line $LINENO" >&2' ERR

      export OCIR_USER=${ocir_user:-}
      export OCIR_USERNAME=${ocir_user:-}
      export OCIR_TOKEN=${ocir_token:-}
      export NAMESPACE=${namespace:-}
      export TENANCY_NAMESPACE=${tenancy_namespace:-${namespace:-}}
      export REGION_KEY=${region_key:-}
      export PUSH_TO_OCIR=1
      export OCI_REGION=${region:-${oci_region:-}}

      echo "=== BUILD score CONTEXT ==="
      echo "NAMESPACE=${NAMESPACE:-unset} REGION_KEY=${REGION_KEY:-unset} OCI_REGION=${OCI_REGION:-unset} OCIR_USER=$(test -n "${OCIR_USER:-}" && echo set || echo unset) OCIR_TOKEN=$(test -n "${OCIR_TOKEN:-}" && echo present || echo unset)"
      node -v || true; npm -v || true; npx -v || true
      which docker || true; docker -v || true
      which podman || true; podman -v || true

      echo "Resolving zx binary..."
      ZX_BIN="$(command -v zx || true)"
      if [ -z "$ZX_BIN" ]; then ZX_BIN="$(npm bin -g)/zx"; fi
      if [ ! -x "$ZX_BIN" ]; then
        npm i -g zx@7
        ZX_BIN="$(command -v zx || true)"
        if [ -z "$ZX_BIN" ]; then ZX_BIN="$(npm bin -g)/zx"; fi
      fi
      "$ZX_BIN" --version || true

      echo "Invoking build script..."
      DEBUG_BUILD=1 "$ZX_BIN" scripts/build.mjs score

outputArtifacts:
  - name: server
    type: DOCKER_IMAGE
    location: server:${WS_SERVER_VERSION}
  - name: web
    type: DOCKER_IMAGE
    location: web:${WEB_VERSION}
  - name: score
    type: DOCKER_IMAGE
    location: score:${SCORE_VERSION}
