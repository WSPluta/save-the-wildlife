version: 0.1             
component: build
timeoutInSeconds: 1200
failImmediatelyOnError: true
shell: bash

env:
  exportedVariables:
    - WS_SERVER_VERSION
    - WEB_VERSION
    - SCORE_VERSION
    - REPLAY_VERSION

steps:
  - type: Command
    name: "Install libraries"
    command: |
      dnf update -y
      dnf install jq -y
      # Install OCI CLI if not available
      if ! command -v oci &> /dev/null; then
        curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh | bash -s -- --accept-all-defaults
        export PATH="$HOME/bin:$PATH"
      fi
      # Configure OCI CLI (assuming environment variables are set)
      if [ -n "$OCI_REGION" ] && [ -n "$OCI_TENANCY" ]; then
        oci setup config --region "$OCI_REGION" --tenancy "$OCI_TENANCY" --user "$OCI_USER" --fingerprint "$OCI_FINGERPRINT" --key-file "$OCI_KEY_FILE"
      fi
  - type: Command
    name: "Set up server versions"
    command: |
      export WS_SERVER_VERSION=$(cat server/package.json | jq .version | tr -d '/"')
      echo "WS_SERVER_VERSION: $WS_SERVER_VERSION"
      export WEB_VERSION=$(cat web/package.json | jq .version | tr -d '/"')
      echo "WEB_VERSION: $WEB_VERSION"
      export SCORE_VERSION=$(grep "version = " score/build.gradle | cut -d "'" -f2)
      echo "SCORE_VERSION: $SCORE_VERSION"
      export REPLAY_VERSION=$(grep "version = " replay/build.gradle | cut -d "'" -f2)
      echo "REPLAY_VERSION: $REPLAY_VERSION"
  - type: Command
    name: "Build ws-server"
    command: |
      export OCIR_USER=${ocir_user:-}
      export OCIR_USERNAME=${ocir_user:-}
      export OCIR_TOKEN=${ocir_token:-}
      export NAMESPACE=${namespace:-}
      export REGION_KEY=${region_key:-}
      npx zx scripts/build.mjs ws-server
  - type: Command
    name: "Build web"
    command: |
      export OCIR_USER=${ocir_user:-}
      export OCIR_USERNAME=${ocir_user:-}
      export OCIR_TOKEN=${ocir_token:-}
      export NAMESPACE=${namespace:-}
      export REGION_KEY=${region_key:-}
      npx zx scripts/build.mjs web
  - type: Command
    name: "Build score"
    command: |
      export OCIR_USER=${ocir_user:-}
      export OCIR_USERNAME=${ocir_user:-}
      export OCIR_TOKEN=${ocir_token:-}
      export NAMESPACE=${namespace:-}
      export REGION_KEY=${region_key:-}
      npx zx scripts/build.mjs score
  - type: Command
    name: "Build replay"
    command: |
      export OCIR_USER=${ocir_user:-}
      export OCIR_USERNAME=${ocir_user:-}
      export OCIR_TOKEN=${ocir_token:-}
      export NAMESPACE=${namespace:-}
      export REGION_KEY=${region_key:-}
      npx zx scripts/build.mjs replay

outputArtifacts:
  - name: server
    type: DOCKER_IMAGE
    location: server:${WS_SERVER_VERSION}
  - name: web
    type: DOCKER_IMAGE
    location: web:${WEB_VERSION}
  - name: score
    type: DOCKER_IMAGE
    location: score:${SCORE_VERSION}
  - name: replay
    type: DOCKER_IMAGE
    location: replay:${REPLAY_VERSION}
