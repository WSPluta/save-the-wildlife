version: 0.1
component: command
timeoutInSeconds: 900
failImmediatelyOnError: true
shell: bash

steps:
  - type: Command
    name: "Install nodejs"
    shell: bash
    timeoutInSeconds: 3600
    command: |
      dnf update -y
      dnf module enable -y nodejs:24 || true
      dnf module install -y nodejs || dnf install -y nodejs
  - type: Command
    name: "Git Clone"
    shell: bash
    timeoutInSeconds: 100
    command: |
      git clone ${github_repo_url}
  - type: Command
    name: "Setup kube config"
    shell: bash
    timeoutInSeconds: 100
    command: |
      oci ce cluster create-kubeconfig --cluster-id ${cluster} \
        --file $HOME/.kube/config --region ${region} --token-version 2.0.0  \
        --kube-endpoint PUBLIC_ENDPOINT
  - type: Command
    name: "Custom Kustomize with versions"
    shell: bash
    timeoutInSeconds: 300
    command: |
      cd save-the-wildlife
      adb_wallet_password="$(openssl rand -hex 12)_$RANDOM"
      printf '%s' "$adb_wallet_password" > .adb_wallet_password
      chmod 600 .adb_wallet_password
      oci db autonomous-database generate-wallet --autonomous-database-id ${adb_id} --file "./deploy/k8s/base/score/wallet.zip" --password "$adb_wallet_password"
      # Generate wallet for Replay service as well
      oci db autonomous-database generate-wallet --autonomous-database-id ${adb_id} --file "./deploy/k8s/base/replay/wallet.zip" --password "$adb_wallet_password"
      # Generate wallet for the Oracle Private Agent Factory service as well
      oci db autonomous-database generate-wallet --autonomous-database-id ${adb_id} --file "./deploy/k8s/base/private-agent-factory/wallet.zip" --password "$adb_wallet_password"
  - type: Command
    name: "Custom Kustomize with versions"
    shell: bash
    timeoutInSeconds: 300
    command: |
      cd save-the-wildlife
      adb_admin_password=$(oci secrets secret-bundle get --secret-id ${adb_admin_password_id} --query 'data."secret-bundle-content".content' | tr -d '\"' | base64 -d)
      adb_wallet_password=$(cat .adb_wallet_password)
      export OCI_REGION=${region}
      export OCI_COMPARTMENT_OCID=${compartment_id}
      export OCI_GENAI_MODEL_ID=${genai_model_id}
      export PAF_IMAGE_REPOSITORY=${paf_image_repository}
      export PAF_VERSION=${paf_version}
      export PAF_CANVAS_RUN_ENDPOINT_URL="${paf_canvas_run_endpoint_url}"
      export PAF_CANVAS_ROOM_ID="${paf_canvas_room_id}"
      export PAF_CANVAS_TIMEOUT_MS="${paf_canvas_timeout_ms}"
      export PAF_CANVAS_VERIFY_TLS="${paf_canvas_verify_tls}"
      npx zx scripts/kustom.mjs ${region_key} $adb_admin_password ${adb_service} "$adb_wallet_password"
      rm -f .adb_wallet_password
      echo "Wallet and config files generated successfully"
  - type: Command
    name: "Create OCIR Secret"
    shell: bash
    timeoutInSeconds: 300
    command: |
      user_auth_token=$(oci secrets secret-bundle get --secret-id ${user_auth_token_id} --query 'data."secret-bundle-content".content' | tr -d '\"' | base64 -d)
      kubectl delete secret ocir-secret --ignore-not-found
      kubectl create secret docker-registry ocir-secret \
        --docker-server=${region_key}.ocir.io \
        --docker-username="${oci_namespace}/${ocir_user}" \
        --docker-password="$user_auth_token" \
        --docker-email=${ocir_user}
  - type: Command
    name: "Apply kustomization"
    shell: bash
    timeoutInSeconds: 300
    command: |
      cd save-the-wildlife
      kubectl apply -k ./deploy/k8s/overlays/devops
      echo "Kustomization applied successfully"
  - type: Command
    name: "Wait for deployments readiness"
    shell: bash
    timeoutInSeconds: 900
    command: |
      kubectl -n default rollout status deploy/ws-server --timeout=300s
      kubectl -n default rollout status deploy/web --timeout=300s
      kubectl -n default rollout status deploy/replay --timeout=300s
      kubectl -n default rollout status deploy/private-agent-factory --timeout=300s
  - type: Command
    name: "Health check ws-server"
    shell: bash
    timeoutInSeconds: 180
    command: |
      kubectl port-forward svc/ws-server 3000:3000 >/tmp/ws-server-port-forward.log 2>&1 &
      PF_PID=$!
      trap 'kill $PF_PID >/dev/null 2>&1 || true' EXIT
      RC=1
      for i in $(seq 1 30); do
        if curl -sf --max-time 5 http://127.0.0.1:3000/healthz; then
          RC=0
          break
        fi
        if ! kill -0 $PF_PID >/dev/null 2>&1; then
          echo "ws-server port-forward exited early"
          cat /tmp/ws-server-port-forward.log || true
          break
        fi
        sleep 1
      done
      kill $PF_PID || true
      trap - EXIT
      if [ $RC -ne 0 ]; then
        echo "ws-server health check failed"
        cat /tmp/ws-server-port-forward.log || true
        exit 1
      fi
  - type: Command
    name: "Health check private-agent-factory"
    shell: bash
    timeoutInSeconds: 180
    command: |
      kubectl port-forward svc/private-agent-factory 18080:8080 >/tmp/private-agent-factory-port-forward.log 2>&1 &
      PF_PID=$!
      trap 'kill $PF_PID >/dev/null 2>&1 || true' EXIT
      RC=1
      for i in $(seq 1 30); do
        if curl -sf --max-time 5 http://127.0.0.1:18080/healthz; then
          RC=0
          break
        fi
        if ! kill -0 $PF_PID >/dev/null 2>&1; then
          echo "private-agent-factory port-forward exited early"
          cat /tmp/private-agent-factory-port-forward.log || true
          break
        fi
        sleep 1
      done
      kill $PF_PID || true
      trap - EXIT
      if [ $RC -ne 0 ]; then
        echo "private-agent-factory health check failed"
        cat /tmp/private-agent-factory-port-forward.log || true
        exit 1
      fi
  - type: Command
    name: "Get Load Balancer IP address"
    shell: bash
    timeoutInSeconds: 100
    command: |
      LB_PUBLIC_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx --template="{{range .status.loadBalancer.ingress}}{{.ip}}{{end}}")
      echo "http://$LB_PUBLIC_IP/"
