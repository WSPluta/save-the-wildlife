version: 0.1
component: command
timeoutInSeconds: 900
failImmediatelyOnError: true
shell: bash

steps:
  - type: Command
    name: "Install nodejs"
    shell: bash
    timeoutInSeconds: 3600
    command: |
      dnf update -y
      dnf module enable -y nodejs:24 || true
      dnf module install -y nodejs || dnf install -y nodejs
  - type: Command
    name: "Git Clone"
    shell: bash
    timeoutInSeconds: 100
    command: |
      git clone ${github_repo_url}
  - type: Command
    name: "Setup kube config"
    shell: bash
    timeoutInSeconds: 100
    command: |
      oci ce cluster create-kubeconfig --cluster-id ${cluster} \
        --file $HOME/.kube/config --region ${region} --token-version 2.0.0  \
        --kube-endpoint PUBLIC_ENDPOINT
  - type: Command
    name: "Custom Kustomize with versions"
    shell: bash
    timeoutInSeconds: 300
    command: |
      cd save-the-wildlife
      adb_wallet_password="$(openssl rand -hex 12)_$RANDOM"
      printf '%s' "$adb_wallet_password" > .adb_wallet_password
      chmod 600 .adb_wallet_password
      oci db autonomous-database generate-wallet --autonomous-database-id ${adb_id} --file "./deploy/k8s/base/score/wallet.zip" --password "$adb_wallet_password"
      # Generate wallet for Replay service as well
      oci db autonomous-database generate-wallet --autonomous-database-id ${adb_id} --file "./deploy/k8s/base/replay/wallet.zip" --password "$adb_wallet_password"
      # Generate wallet for the Oracle Private Agent Factory service as well
      oci db autonomous-database generate-wallet --autonomous-database-id ${adb_id} --file "./deploy/k8s/base/private-agent-factory/wallet.zip" --password "$adb_wallet_password"
  - type: Command
    name: "Custom Kustomize with versions"
    shell: bash
    timeoutInSeconds: 300
    command: |
      cd save-the-wildlife
      adb_admin_password=$(oci secrets secret-bundle get --secret-id ${adb_admin_password_id} --query 'data."secret-bundle-content".content' | tr -d '\"' | base64 -d)
      adb_wallet_password=$(cat .adb_wallet_password)
      export OCI_REGION=${region}
      export OCI_COMPARTMENT_OCID=${compartment_id}
      export OCI_GENAI_MODEL_ID=${genai_model_id}
      export PAF_IMAGE_REPOSITORY=${paf_image_repository}
      export PAF_VERSION="$${PAF_VERSION:-${paf_version}}"
      export PAF_MCP_ENABLED="${paf_mcp_enabled}"
      export PAF_MCP_PUBLIC_URL="${paf_mcp_public_url}"
      export MODEL_AI_TRAINING_VERSION="$${MODEL_AI_TRAINING_VERSION:-latest}"
      export MODEL_AI_INFERENCE_VERSION="$${MODEL_AI_INFERENCE_VERSION:-latest}"
      export PAF_CANVAS_RUN_ENDPOINT_URL="${paf_canvas_run_endpoint_url}"
      export PAF_CANVAS_ROOM_ID="${paf_canvas_room_id}"
      export PAF_CANVAS_TIMEOUT_MS="${paf_canvas_timeout_ms}"
      export PAF_COMMENTARY_DEADLINE_MS="${paf_commentary_deadline_ms}"
      export PAF_CANVAS_RETURN_RESERVE_MS="${paf_canvas_return_reserve_ms}"
      export PAF_CANVAS_MIN_TIMEOUT_MS="${paf_canvas_min_timeout_ms}"
      export PAF_CANVAS_VERIFY_TLS="${paf_canvas_verify_tls}"
      export PAF_MODEL_ROUTE_MODE="${paf_model_route_mode}"
      export PAF_PRIMARY_MODEL_PROVIDER="${paf_primary_model_provider}"
      export PAF_CANDIDATE_MODEL_PROVIDER="${paf_candidate_model_provider}"
      export OCI_BASE_MODEL_ENDPOINT_URL="${oci_base_model_endpoint_url}"
      export OCI_FT_MODEL_ENDPOINT_URL="${oci_ft_model_endpoint_url}"
      export MODEL_AI_BASE_UPSTREAM_URL="$${MODEL_AI_BASE_UPSTREAM_URL:-${model_ai_base_upstream_url}}"
      export MODEL_AI_FT_UPSTREAM_URL="$${MODEL_AI_FT_UPSTREAM_URL:-${model_ai_ft_upstream_url}}"
      export MODEL_AI_BASE_UPSTREAM_FORMAT="$${MODEL_AI_BASE_UPSTREAM_FORMAT:-${model_ai_base_upstream_format}}"
      export MODEL_AI_FT_UPSTREAM_FORMAT="$${MODEL_AI_FT_UPSTREAM_FORMAT:-${model_ai_ft_upstream_format}}"
      export MODEL_AI_BASE_UPSTREAM_MODEL_ID="$${MODEL_AI_BASE_UPSTREAM_MODEL_ID:-${model_ai_base_upstream_model_id}}"
      export MODEL_AI_FT_UPSTREAM_MODEL_ID="$${MODEL_AI_FT_UPSTREAM_MODEL_ID:-${model_ai_ft_upstream_model_id}}"
      export MODEL_AI_REQUIRE_UPSTREAM_READY="${model_ai_require_upstream_ready}"
      export MODEL_AI_REQUIRE_PRIVATE_OLLAMA="${model_ai_require_private_ollama}"
      export OCI_MODEL_ENDPOINT_TIMEOUT_MS="${oci_model_endpoint_timeout_ms}"
      export OCI_MODEL_ENDPOINT_VERIFY_TLS="${oci_model_endpoint_verify_tls}"
      export PAF_TRACE_PERSIST="${paf_trace_persist}"
      export PAF_EVAL_ENABLED="${paf_eval_enabled}"
      export PAF_MODEL_FAST_PATH_ENABLED="${paf_model_fast_path_enabled}"
      export PAF_EVAL_RUBRIC_VERSION="${paf_eval_rubric_version}"
      export PAF_TRAINING_CAPTURE_ENABLED="${paf_training_capture_enabled}"
      if [ "$MODEL_AI_REQUIRE_UPSTREAM_READY" = "true" ] || [ "$MODEL_AI_REQUIRE_PRIVATE_OLLAMA" = "true" ] || \
         [ "$MODEL_AI_BASE_UPSTREAM_URL" != "http://stwl-ollama-fallback:11434/api/chat" ] || \
         [ "$MODEL_AI_FT_UPSTREAM_URL" != "http://stwl-ollama-fallback:11434/api/chat" ]; then
        check_flags=(--mode cluster)
        if [ "$MODEL_AI_REQUIRE_PRIVATE_OLLAMA" = "true" ]; then
          check_flags+=(--require-private)
        fi
        node scripts/model-ollama-upstream-check.mjs \
          --base-url "$MODEL_AI_BASE_UPSTREAM_URL" \
          --ft-url "$MODEL_AI_FT_UPSTREAM_URL" \
          --base-model "$MODEL_AI_BASE_UPSTREAM_MODEL_ID" \
          --ft-model "$MODEL_AI_FT_UPSTREAM_MODEL_ID" \
          "$${check_flags[@]}"
      fi
      npx zx scripts/kustom.mjs ${region_key} $adb_admin_password ${adb_service} "$adb_wallet_password"
      echo "Wallet and config files generated successfully"
  - type: Command
    name: "Import PAF Canvas flow"
    shell: bash
    timeoutInSeconds: 300
    command: |
      cd save-the-wildlife
      if [ "${paf_canvas_import_enabled}" != "true" ]; then
        echo "PAF Canvas import disabled; skipping."
        exit 0
      fi
      if [ -z "${paf_canvas_host}" ]; then
        echo "paf_canvas_host is required when paf_canvas_import_enabled=true"
        exit 1
      fi
      if [ -z "${paf_canvas_ssh_key_secret_id}" ]; then
        echo "paf_canvas_ssh_key_secret_id is required when paf_canvas_import_enabled=true"
        exit 1
      fi
      canvas_ssh_key=/tmp/stwl-paf-canvas.key
      oci secrets secret-bundle get --secret-id ${paf_canvas_ssh_key_secret_id} --query 'data."secret-bundle-content".content' | tr -d '\"' | base64 -d > "$canvas_ssh_key"
      chmod 600 "$canvas_ssh_key"
      mcp_public_url="${paf_mcp_public_url}"
      if [ -z "$mcp_public_url" ]; then
        echo "paf_mcp_public_url is required when paf_canvas_import_enabled=true"
        exit 1
      fi
      import_args=(
        --paf-ip "${paf_canvas_host}"
        --ssh-user "${paf_canvas_ssh_user}"
        --ssh-key "$canvas_ssh_key"
        --manifest manifests/private-agent-factory/save-the-wildlife-commentary-canvas-flow.json
        --flow-name "${paf_canvas_flow_name}"
        --flow-description "Save the Wildlife live commentator for Oracle AI Database gameplay telemetry."
        --llm-config-name "${paf_canvas_llm_config_name}"
        --mcp-server-url "$mcp_public_url"
      )
      if [ -n "${paf_canvas_agent_factory_user}" ]; then
        import_args+=(--agent-factory-user "${paf_canvas_agent_factory_user}")
      fi
      if [ "${paf_canvas_require_llm_config}" = "true" ]; then
        import_args+=(--require-llm-config)
      fi
      python3 scripts/import_paf_canvas_flow.py "$${import_args[@]}" | tee /tmp/stwl-paf-canvas-import.log
      run_endpoint_url=$(grep '^run_endpoint_url=' /tmp/stwl-paf-canvas-import.log | tail -1 | cut -d= -f2-)
      if [ -z "$run_endpoint_url" ]; then
        echo "PAF Canvas import did not produce a run endpoint."
        exit 1
      fi
      export PAF_CANVAS_RUN_ENDPOINT_URL="$run_endpoint_url"
      export PAF_MCP_PUBLIC_URL="$mcp_public_url"
      adb_admin_password=$(oci secrets secret-bundle get --secret-id ${adb_admin_password_id} --query 'data."secret-bundle-content".content' | tr -d '\"' | base64 -d)
      adb_wallet_password=$(cat .adb_wallet_password)
      npx zx scripts/kustom.mjs ${region_key} "$adb_admin_password" ${adb_service} "$adb_wallet_password"
      rm -f "$canvas_ssh_key"
      rm -f .adb_wallet_password
      echo "Imported PAF Canvas flow and configured run endpoint: $run_endpoint_url"
  - type: Command
    name: "Clean generated ADB wallet password"
    shell: bash
    timeoutInSeconds: 60
    command: |
      cd save-the-wildlife
      rm -f .adb_wallet_password
  - type: Command
    name: "Create OCIR Secret"
    shell: bash
    timeoutInSeconds: 300
    command: |
      user_auth_token=$(oci secrets secret-bundle get --secret-id ${user_auth_token_id} --query 'data."secret-bundle-content".content' | tr -d '\"' | base64 -d)
      kubectl delete secret ocir-secret --ignore-not-found
      kubectl create secret docker-registry ocir-secret \
        --docker-server=${region_key}.ocir.io \
        --docker-username="${oci_namespace}/${ocir_user}" \
        --docker-password="$user_auth_token" \
        --docker-email=${ocir_user}
  - type: Command
    name: "Create model endpoint auth secret"
    shell: bash
    timeoutInSeconds: 180
    command: |
      if [ -z "${oci_model_endpoint_auth_secret_id}" ]; then
        echo "No model endpoint auth Vault secret configured; skipping private-agent-factory-model-auth"
        kubectl delete secret private-agent-factory-model-auth --ignore-not-found
        exit 0
      fi
      model_endpoint_auth_secret=$(oci secrets secret-bundle get --secret-id ${oci_model_endpoint_auth_secret_id} --query 'data."secret-bundle-content".content' | tr -d '\"' | base64 -d)
      kubectl delete secret private-agent-factory-model-auth --ignore-not-found
      kubectl create secret generic private-agent-factory-model-auth \
        --from-literal=OCI_MODEL_ENDPOINT_AUTH_SECRET="$model_endpoint_auth_secret"
  - type: Command
    name: "Apply kustomization"
    shell: bash
    timeoutInSeconds: 300
    command: |
      cd save-the-wildlife
      kubectl apply -k ./deploy/k8s/overlays/devops
      kubectl delete statefulset redis --ignore-not-found
      kubectl delete service redis --ignore-not-found
      echo "Kustomization applied successfully"
  - type: Command
    name: "Wait for deployments readiness"
    shell: bash
    timeoutInSeconds: 900
    command: |
      kubectl -n default rollout status deploy/coherence --timeout=300s
      kubectl -n default rollout status deploy/score --timeout=300s
      kubectl -n default rollout status deploy/ws-server --timeout=600s
      kubectl -n default rollout status deploy/web --timeout=300s
      kubectl -n default rollout status deploy/replay --timeout=300s
      kubectl -n default rollout status deploy/bots --timeout=300s
      kubectl -n default rollout status deploy/stwl-base-commentary --timeout=300s
      kubectl -n default rollout status deploy/stwl-ft-commentary --timeout=300s
      kubectl -n default rollout status deploy/private-agent-factory --timeout=300s
  - type: Command
    name: "Health check ws-server"
    shell: bash
    timeoutInSeconds: 180
    command: |
      kubectl port-forward svc/ws-server 3000:3000 >/tmp/ws-server-port-forward.log 2>&1 &
      PF_PID=$!
      trap 'kill $PF_PID >/dev/null 2>&1 || true' EXIT
      RC=1
      for i in $(seq 1 30); do
        if curl -sf --max-time 5 http://127.0.0.1:3000/healthz; then
          RC=0
          break
        fi
        if ! kill -0 $PF_PID >/dev/null 2>&1; then
          echo "ws-server port-forward exited early"
          cat /tmp/ws-server-port-forward.log || true
          break
        fi
        sleep 1
      done
      kill $PF_PID || true
      trap - EXIT
      if [ $RC -ne 0 ]; then
        echo "ws-server health check failed"
        cat /tmp/ws-server-port-forward.log || true
        exit 1
      fi
  - type: Command
    name: "Health check private-agent-factory"
    shell: bash
    timeoutInSeconds: 180
    command: |
      kubectl port-forward svc/private-agent-factory 18080:8080 >/tmp/private-agent-factory-port-forward.log 2>&1 &
      PF_PID=$!
      trap 'kill $PF_PID >/dev/null 2>&1 || true' EXIT
      RC=1
      for i in $(seq 1 30); do
        if curl -sf --max-time 5 http://127.0.0.1:18080/healthz; then
          RC=0
          break
        fi
        if ! kill -0 $PF_PID >/dev/null 2>&1; then
          echo "private-agent-factory port-forward exited early"
          cat /tmp/private-agent-factory-port-forward.log || true
          break
        fi
        sleep 1
      done
      kill $PF_PID || true
      trap - EXIT
      if [ $RC -ne 0 ]; then
        echo "private-agent-factory health check failed"
        cat /tmp/private-agent-factory-port-forward.log || true
        exit 1
      fi
  - type: Command
    name: "Get Load Balancer IP address"
    shell: bash
    timeoutInSeconds: 100
    command: |
      LB_PUBLIC_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx --template="{{range .status.loadBalancer.ingress}}{{.ip}}{{end}}")
      echo "http://$LB_PUBLIC_IP/"
