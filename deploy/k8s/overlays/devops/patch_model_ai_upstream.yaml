apiVersion: apps/v1
kind: Deployment
metadata:
  name: stwl-base-commentary
spec:
  template:
    spec:
      containers:
        - name: model-ai-inference
          env:
            - name: STWL_UPSTREAM_URL
              value: "http://stwl-ollama-fallback:11434/api/chat"
            - name: STWL_UPSTREAM_FORMAT
              value: "ollama"
            - name: STWL_MODEL_ID
              value: "llama3.2:1b"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stwl-ft-commentary
spec:
  template:
    spec:
      containers:
        - name: model-ai-inference
          env:
            - name: STWL_UPSTREAM_URL
              value: "http://stwl-ollama-fallback:11434/api/chat"
            - name: STWL_UPSTREAM_FORMAT
              value: "ollama"
            - name: STWL_MODEL_ID
              value: "llama3.2:1b-stwl"
