apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: coherence
  name: coherence
spec:
  minReadySeconds: 30
  replicas: 1
  selector:
    matchLabels:
      app: coherence
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: coherence
    spec:
      containers:
        - image: ghcr.io/oracle/coherence-ce:25.03.1
          name: coherence
          readinessProbe:
            tcpSocket:
              port: 1408
            initialDelaySeconds: 10
            periodSeconds: 5
          ports:
            - containerPort: 1408
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 4Gi
      imagePullSecrets:
        - name: ocir-secret
