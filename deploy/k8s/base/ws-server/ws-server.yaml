apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ws-server
  name: ws-server
spec:
  minReadySeconds: 100
  replicas: 1
  selector:
    matchLabels:
      app: ws-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: ws-server
    spec:
      containers:
        - image: ws-server
          imagePullPolicy: Always
          name: ws-server
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /healthz
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 521Mi
          env:
          - name: NODE_ENV
            value: "production"
          - name: SCORE_SERVICE_BASE_URL
            value: "http://score:8080"
          volumeMounts:
          - name: config-volume
            mountPath: /usr/src/app/config
      volumes:
      - name: config-volume
        configMap:
          name: ws-server-env
      imagePullSecrets:
        - name: ocir-secret
