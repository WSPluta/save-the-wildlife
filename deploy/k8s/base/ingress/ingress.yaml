apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/server-snippet: |
      add_header X-Content-Type-Options nosniff;
      add_header X-Frame-Options SAMEORIGIN;
      add_header X-XSS-Protection "1; mode=block";
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - stwl.opcvr.tech
    secretName: tls
  rules:
  - host: stwl.opcvr.tech
    http:
      paths:
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: ws-server
            port:
              number: 3000
      - path: /api/replay
        pathType: Prefix
        backend:
          service:
            name: replay
            port:
              number: 8082
      - path: /paf
        pathType: Prefix
        backend:
          service:
            name: private-agent-factory
            port:
              number: 8080
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: score
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
