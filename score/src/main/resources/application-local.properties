# Local profile for Oracle DB 23ai container
spring.profiles: local

# Oracle DB Local
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@${ORACLE_DB_HOST:localhost}:${ORACLE_DB_PORT:1521}/${ORACLE_DB_NAME:FREEPDB1}
spring.datasource.username=${ORACLE_DB_USERNAME:ADMIN}
spring.datasource.password=${ORACLE_DB_PASSWORD}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.use-new-id-generator-mappings=false
spring.jpa.hibernate.ddl-auto=update

# UCP for local (reduced pool for dev)
oracle.jdbc.fanEnabled=true
spring.datasource.type=oracle.ucp.jdbc.PoolDataSource
spring.datasource.oracleucp.sql-for-validate-connection=select * from dual
spring.datasource.oracleucp.connection-pool-name=localConnectionPool
spring.datasource.oracleucp.initial-pool-size=2
spring.datasource.oracleucp.min-pool-size=2
spring.datasource.oracleucp.max-pool-size=5

# Logging for local dev
logging.level.root=DEBUG
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
